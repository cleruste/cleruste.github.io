<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #ffffff;
            color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 24px;
        }

        #status {
            font-size: 13px;
            color: #999999;
        }

        #list {
            list-style: none;
            margin-top: 8px;
        }

        #list a {
            display: block;
            padding: 10px 0;
            font-size: 16px;
            color: #111111;
            text-decoration: none;
            border-bottom: 1px solid #eeeeee;
        }

        #list a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="status">Loading…</div>
    <ul id="list"></ul>

    <script>
        (function () {
            'use strict';

            var GITHUB_USER = (location.hostname.indexOf('.github.io') !== -1 && location.hostname.split('.')[0] !== 'www')
                ? location.hostname.split('.')[0]
                : 'cleruste';

            function fetchAllRepos() {
                var repos = [];
                function getPage(page) {
                    return fetch('https://api.github.com/users/' + GITHUB_USER + '/repos?per_page=100&page=' + page + '&sort=pushed')
                        .then(function (res) {
                            if (!res.ok) throw new Error('HTTP ' + res.status);
                            return res.json();
                        })
                        .then(function (data) {
                            repos = repos.concat(data);
                            if (data.length === 100 && page < 3) return getPage(page + 1);
                            return repos;
                        });
                }
                return getPage(1);
            }

            function fetchProjects() {
                return fetchAllRepos().then(function (repos) {
                    return repos.filter(function (r) {
                        return r.has_pages && !r.fork && !r.archived && !/\.github\.io$/.test(r.name);
                    }).sort(function (a, b) {
                        return new Date(b.pushed_at) - new Date(a.pushed_at);
                    });
                });
            }

            function render(projects) {
                var list = document.getElementById('list');
                var status = document.getElementById('status');
                status.style.display = 'none';
                list.innerHTML = '';

                projects.forEach(function (p) {
                    var li = document.createElement('li');
                    var a = document.createElement('a');
                    a.href = './' + p.name + '/';
                    a.textContent = p.name;
                    li.appendChild(a);
                    list.appendChild(li);
                });
            }

            document.addEventListener('DOMContentLoaded', function () {
                var cache = null;
                try { cache = JSON.parse(sessionStorage.getItem('index_cache') || 'null'); } catch (e) { cache = null; }
                if (cache && (Date.now() - cache.time) < 10 * 60 * 1000) {
                    render(cache.projects);
                    return;
                }
                fetchProjects().then(function (projects) {
                    try {
                        sessionStorage.setItem('index_cache', JSON.stringify({ time: Date.now(), projects: projects }));
                    } catch (e) { /* storage unavailable — ignore */ }
                    render(projects);
                }).catch(function () {
                    document.getElementById('status').style.display = 'none';
                });
            });
        })();
    </script>
</body>
</html>
