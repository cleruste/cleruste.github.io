<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            min-height: 100%;
        }

        body {
            background: #0b1020 radial-gradient(ellipse at 30% 20%, #16213e 0%, #0b1020 60%);
            color: #e8ecf4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            padding: 48px 24px;
        }

        .wrap {
            max-width: 920px;
            margin: 0 auto;
        }

        #status {
            font-size: 13px;
            color: #6b7590;
        }

        .grid {
            margin-top: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
        }

        .tile {
            display: block;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.16);
            background: rgba(21, 30, 56, 0.66);
            backdrop-filter: blur(8px);
            text-decoration: none;
            color: inherit;
            transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
        }

        .tile:hover {
            transform: translateY(-3px);
            border-color: rgba(125, 211, 252, 0.55);
            background: rgba(30, 44, 78, 0.8);
        }

        .tile-name {
            font-size: 17px;
            font-weight: 700;
            color: #7dd3fc;
            word-break: break-all;
        }

        .tile-desc {
            margin-top: 8px;
            font-size: 13px;
            line-height: 1.5;
            color: #9aa5bd;
        }
    </style>
</head>
<body>
    <main class="wrap">
        <div id="status">Loading…</div>
        <div id="grid" class="grid"></div>
    </main>

    <script>
        (function () {
            'use strict';

            var GITHUB_USER = (location.hostname.indexOf('.github.io') !== -1 && location.hostname.split('.')[0] !== 'www')
                ? location.hostname.split('.')[0]
                : 'cleruste';

            function fetchAllRepos() {
                var repos = [];
                function getPage(page) {
                    return fetch('https://api.github.com/users/' + GITHUB_USER + '/repos?per_page=100&page=' + page + '&sort=pushed')
                        .then(function (res) {
                            if (!res.ok) throw new Error('HTTP ' + res.status);
                            return res.json();
                        })
                        .then(function (data) {
                            repos = repos.concat(data);
                            if (data.length === 100 && page < 3) return getPage(page + 1);
                            return repos;
                        });
                }
                return getPage(1);
            }

            function fetchProjects() {
                return fetchAllRepos().then(function (repos) {
                    return repos.filter(function (r) {
                        return r.has_pages && !r.fork && !r.archived && !/\.github\.io$/.test(r.name);
                    }).sort(function (a, b) {
                        return new Date(b.pushed_at) - new Date(a.pushed_at);
                    });
                });
            }

            function render(projects) {
                var grid = document.getElementById('grid');
                var status = document.getElementById('status');
                status.style.display = 'none';
                grid.innerHTML = '';

                projects.forEach(function (p) {
                    var a = document.createElement('a');
                    a.className = 'tile';
                    a.href = './' + p.name + '/';

                    var name = document.createElement('div');
                    name.className = 'tile-name';
                    name.textContent = p.name;
                    a.appendChild(name);

                    if (p.description) {
                        var desc = document.createElement('div');
                        desc.className = 'tile-desc';
                        desc.textContent = p.description;
                        a.appendChild(desc);
                    }

                    grid.appendChild(a);
                });
            }

            document.addEventListener('DOMContentLoaded', function () {
                var cache = null;
                try { cache = JSON.parse(sessionStorage.getItem('index_cache') || 'null'); } catch (e) { cache = null; }
                if (cache && (Date.now() - cache.time) < 10 * 60 * 1000) {
                    render(cache.projects);
                    return;
                }
                fetchProjects().then(function (projects) {
                    try {
                        sessionStorage.setItem('index_cache', JSON.stringify({ time: Date.now(), projects: projects }));
                    } catch (e) { /* storage unavailable — ignore */ }
                    render(projects);
                }).catch(function () {
                    document.getElementById('status').style.display = 'none';
                });
            });
        })();
    </script>
</body>
</html>
